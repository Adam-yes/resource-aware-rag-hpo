<svg width="1280" height="660" viewBox="0 0 1280 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">System architecture for resource-aware RAG HPO</title>
  <desc id="desc">A genetic optimizer configures the indexing, retrieval, and generation stages of a Naive-RAG pipeline that is scored by an automated factual-correctness evaluator.</desc>

  <defs>
    <marker id="flow" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1.5L7.5 5L1 8.5Z" fill="#64748B"/>
    </marker>
    <marker id="teal" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L6.5 4.5L1 8Z" fill="#3F9E8E"/>
    </marker>
    <marker id="amber" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L6.5 4.5L1 8Z" fill="#C9882B"/>
    </marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L6.5 4.5L1 8Z" fill="#5B73C4"/>
    </marker>
    <marker id="ink" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1.5L7.5 5L1 8.5Z" fill="#16202A"/>
    </marker>
  </defs>

  <rect width="1280" height="660" fill="#F7F8FA"/>
  <rect x="54" y="48" width="1172" height="564" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="94" y="106" fill="#16202A" font-size="32" font-weight="700">System Architecture</text>
    <text x="94" y="138" fill="#64748B" font-size="16">A Naive-RAG pipeline configured by evolutionary search and scored with factual correctness.</text>

    <!-- Optimizer -->
    <rect x="392" y="166" width="496" height="78" rx="18" fill="#16202A"/>
    <text x="640" y="200" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="700">Genetic Algorithm Optimizer</text>
    <text x="640" y="225" text-anchor="middle" fill="#AEBACB" font-size="13.5">population N · generation G · elitism · crossover · mutation</text>

    <!-- Pipeline stages -->
    <rect x="114" y="318" width="166" height="92" rx="16" fill="#F2F5F8" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="197" y="354" text-anchor="middle" fill="#1F2933" font-size="18" font-weight="700">Documents</text>
    <text x="197" y="379" text-anchor="middle" fill="#64748B" font-size="13.5">licensed technical</text>
    <text x="197" y="398" text-anchor="middle" fill="#64748B" font-size="13.5">manuals</text>

    <rect x="328" y="318" width="166" height="92" rx="16" fill="#EAF7F4" stroke="#66B7A6" stroke-width="1.5"/>
    <text x="411" y="354" text-anchor="middle" fill="#15352F" font-size="18" font-weight="700">Indexing</text>
    <text x="411" y="379" text-anchor="middle" fill="#3E665D" font-size="13.5">chunk size</text>
    <text x="411" y="398" text-anchor="middle" fill="#3E665D" font-size="13.5">chunk overlap</text>

    <rect x="542" y="318" width="166" height="92" rx="16" fill="#FFF4E0" stroke="#E0A13D" stroke-width="1.5"/>
    <text x="625" y="354" text-anchor="middle" fill="#4A3010" font-size="18" font-weight="700">Retrieval</text>
    <text x="625" y="379" text-anchor="middle" fill="#7C5A24" font-size="13.5">Chroma store</text>
    <text x="625" y="398" text-anchor="middle" fill="#7C5A24" font-size="13.5">top-k context</text>

    <rect x="756" y="318" width="166" height="92" rx="16" fill="#EDF2FF" stroke="#6E88D8" stroke-width="1.5"/>
    <text x="839" y="354" text-anchor="middle" fill="#202E57" font-size="18" font-weight="700">Generation</text>
    <text x="839" y="379" text-anchor="middle" fill="#475891" font-size="13.5">model choice</text>
    <text x="839" y="398" text-anchor="middle" fill="#475891" font-size="13.5">temperature</text>

    <rect x="970" y="318" width="166" height="92" rx="16" fill="#F2F5F8" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="1053" y="354" text-anchor="middle" fill="#1F2933" font-size="18" font-weight="700">Evaluation</text>
    <text x="1053" y="379" text-anchor="middle" fill="#64748B" font-size="13.5">Ragas factual</text>
    <text x="1053" y="398" text-anchor="middle" fill="#64748B" font-size="13.5">correctness F1</text>

    <!-- Horizontal pipeline flow -->
    <path d="M284 364H322" stroke="#64748B" stroke-width="2.5" marker-end="url(#flow)"/>
    <path d="M498 364H536" stroke="#64748B" stroke-width="2.5" marker-end="url(#flow)"/>
    <path d="M712 364H750" stroke="#64748B" stroke-width="2.5" marker-end="url(#flow)"/>
    <path d="M926 364H964" stroke="#64748B" stroke-width="2.5" marker-end="url(#flow)"/>

    <!-- Optimizer to controlled stages: vertical arrows with labels placed beside the line -->
    <path d="M411 250V310" stroke="#3F9E8E" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#teal)"/>
    <path d="M625 250V310" stroke="#C9882B" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#amber)"/>
    <path d="M839 250V310" stroke="#5B73C4" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#blue)"/>

    <rect x="300" y="266" width="92" height="26" rx="13" fill="#EAF7F4" stroke="#66B7A6" stroke-width="1.25"/>
    <text x="346" y="283" text-anchor="middle" fill="#2F5C53" font-size="12.5" font-weight="600">chunking</text>

    <rect x="528" y="266" width="72" height="26" rx="13" fill="#FFF4E0" stroke="#E0A13D" stroke-width="1.25"/>
    <text x="564" y="283" text-anchor="middle" fill="#7C5A24" font-size="12.5" font-weight="600">top-k</text>

    <rect x="722" y="266" width="104" height="26" rx="13" fill="#EDF2FF" stroke="#6E88D8" stroke-width="1.25"/>
    <text x="774" y="283" text-anchor="middle" fill="#3C4E86" font-size="12.5" font-weight="600">LLM params</text>

    <!-- Fitness feedback loop: evaluation back to optimizer -->
    <path d="M1053 312C1053 270 1024 244 956 234C918 228 905 222 894 216" stroke="#16202A" stroke-width="2.5" stroke-dasharray="7 6" fill="none" marker-end="url(#ink)"/>
    <rect x="922" y="246" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.25"/>
    <text x="997" y="264" text-anchor="middle" fill="#1F2933" font-size="13" font-weight="700">fitness feedback</text>

    <!-- Genotype legend -->
    <rect x="172" y="496" width="936" height="64" rx="16" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="204" y="533" fill="#394B59" font-size="15" font-weight="700">Individual genotype</text>
    <text x="352" y="533" fill="#52606D" font-size="12.5" font-family="JetBrains Mono, Consolas, monospace">[chunk_size, chunk_overlap, top_k, temperature, model_name]</text>
    <text x="810" y="533" fill="#64748B" font-size="14.5">= one RAG configuration</text>
  </g>
</svg>
